server {
    listen 80;
    server_name www.tsukimi-yachiyo.top tsukimi-yachiyo.top yachiyo.owo.vin www.yachiyo.owo.vin yachiyo.redchenk.com www.yachiyocat.top yachiyocat.top;

    client_max_body_size 20M;
    root /var/www/yachiyo;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Vue SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ZIP 解压后的静态资源（Nginx 直接 serve）
    location ^~ /static/ {
        alias /var/www/zip-static/;
        add_header Access-Control-Allow-Origin *;
        expires 1y;
        add_header Cache-Control "public, immutable";

        location ~* \.js$   { default_type application/javascript; }
        location ~* \.wasm$ { default_type application/wasm; }
        location ~* \.json$ { default_type application/json; }
    }

    # 解压服务（放在 /api 前面，最长前缀匹配优先）
    location /api/extract {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # 后端 API
    location /api {
        proxy_pass http://211.101.237.141:8881;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
    }

    # 文件服务
    location /file {
        proxy_pass http://211.101.237.141:8881;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
    }

    # WebSocket
    location /ws {
        proxy_pass http://211.101.237.141:8881;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康检查
    location /actuator {
        proxy_pass http://211.101.237.141:8881;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
